name: Auto Deploy with OSS
permissions:
    contents: read

on:
    push:
        branches:
            - master
    workflow_dispatch:

concurrency:
    group: production-deployment
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: production
        steps:
            - name: Checkout
              uses: actions/checkout@v6.0.1

            - name: Setup Node
              uses: actions/setup-node@v6.1.0
              with:
                  node-version: 22
                  cache: npm

            - name: Validate deployment configuration
              env:
                  SERVER_A_HOST: ${{ secrets.SERVER_A_HOST }}
                  SERVER_A_PASSWORD: ${{ secrets.SERVER_A_PASSWORD }}
                  SERVER_B_HOST: ${{ secrets.SERVER_B_HOST }}
                  SERVER_B_PASSWORD: ${{ secrets.SERVER_B_PASSWORD }}
                  OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
                  OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
                  OSS_DOMAIN: ${{ secrets.OSS_DOMAIN }}
                  OSS_KEY_ID: ${{ secrets.OSS_KEY_ID }}
                  OSS_KEY_SECRET: ${{ secrets.OSS_KEY_SECRET }}
                  BACKEND_API_URL: ${{ secrets.BACKEND_API_URL }}
              run: |
                  test -n "$SERVER_A_HOST"
                  test -n "$SERVER_A_PASSWORD"
                  test -n "$SERVER_B_HOST"
                  test -n "$SERVER_B_PASSWORD"
                  test -n "$OSS_ENDPOINT"
                  test -n "$OSS_BUCKET"
                  test -n "$OSS_DOMAIN"
                  test -n "$OSS_KEY_ID"
                  test -n "$OSS_KEY_SECRET"
                  test -n "$BACKEND_API_URL"

            - name: Install Dependencies
              run: npm ci

            - name: Build Markdown Renderer
              run: npm run build -w @luogu-saver/markdown-renderer

            - name: Build Frontend
              run: npm run build:app -w @luogu-saver/frontend
              env:
                  VITE_API_URL: ${{ secrets.BACKEND_API_URL }}
                  VITE_CDN_URL: ${{ secrets.OSS_DOMAIN }}/luogu-saver/

            - name: Build Backend
              run: npm run build -w @luogu-saver/backend

            - name: Upload Assets to S3
              env:
                  AWS_ACCESS_KEY_ID: ${{ secrets.OSS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.OSS_KEY_SECRET }}
                  AWS_DEFAULT_REGION: us-east-1
              run: |
                  aws s3 sync packages/frontend/dist s3://${{ secrets.OSS_BUCKET }}/luogu-saver/ \
                    --endpoint-url ${{ secrets.OSS_ENDPOINT }} \
                    --acl public-read \
                    --delete \
                    --exclude "index.html"

            - name: Deploy Frontend
              uses: appleboy/scp-action@master
              with:
                  host: ${{ secrets.SERVER_A_HOST }}
                  username: root
                  password: ${{ secrets.SERVER_A_PASSWORD }}
                  timeout: 120s
                  source: 'packages/frontend/dist/*'
                  target: '/opt/luogu-saver-frontend'
                  strip_components: 3

            - name: Wait for Backend SSH
              env:
                  SERVER_HOST: ${{ secrets.SERVER_B_HOST }}
              run: |
                  for attempt in 1 2 3 4 5 6; do
                    if timeout 10 bash -c "echo > /dev/tcp/${SERVER_HOST}/22" 2>/dev/null; then
                      echo "Backend SSH port is reachable."
                      exit 0
                    fi
                    echo "Backend SSH is not reachable yet (attempt ${attempt}/6)."
                    sleep 10
                  done
                  echo "Backend SSH port remained unreachable."
                  exit 1

            - name: Prepare Backend Staging Directory
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.SERVER_B_HOST }}
                  username: root
                  password: ${{ secrets.SERVER_B_PASSWORD }}
                  timeout: 120s
                  script: |
                      set -eu
                      LIVE_DIR=/opt/luogu-saver-backend
                      NEXT_DIR=/opt/luogu-saver-backend-next

                      rm -rf "$NEXT_DIR"
                      mkdir -p "$NEXT_DIR"
                      if [ -f "$LIVE_DIR/.env" ]; then
                        cp -a "$LIVE_DIR/.env" "$NEXT_DIR/.env"
                      fi
                      if [ -f "$LIVE_DIR/config.yml" ]; then
                        cp -a "$LIVE_DIR/config.yml" "$NEXT_DIR/config.yml"
                      fi

            - name: Stage Backend
              uses: appleboy/scp-action@master
              with:
                  host: ${{ secrets.SERVER_B_HOST }}
                  username: root
                  password: ${{ secrets.SERVER_B_PASSWORD }}
                  timeout: 120s
                  source: 'packages/backend/dist,packages/backend/scripts,packages/backend/package.json'
                  target: '/opt/luogu-saver-backend-next'
                  strip_components: 2

            - name: Prepare Staged Backend
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.SERVER_B_HOST }}
                  username: root
                  password: ${{ secrets.SERVER_B_PASSWORD }}
                  timeout: 120s
                  script: |
                      set -eu
                      export NVM_DIR="$HOME/.nvm"
                      [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

                      cd /opt/luogu-saver-backend-next
                      npm install --omit=dev
                      if [ -f .env ]; then
                        node --env-file=.env -e "require('./dist/config')"
                      else
                        node -e "require('./dist/config')"
                      fi

            - name: Stop and Start Backend Service
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.SERVER_B_HOST }}
                  username: root
                  password: ${{ secrets.SERVER_B_PASSWORD }}
                  timeout: 120s
                  script: |
                      set -eu
                      export NVM_DIR="$HOME/.nvm"
                      [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

                      LIVE_DIR=/opt/luogu-saver-backend
                      NEXT_DIR=/opt/luogu-saver-backend-next
                      PREVIOUS_DIR=/opt/luogu-saver-backend-previous

                      if pm2 describe luogu-backend > /dev/null; then
                        pm2 stop luogu-backend
                        pm2 delete luogu-backend
                      fi

                      rm -rf "$PREVIOUS_DIR"
                      if [ -d "$LIVE_DIR" ]; then
                        mv "$LIVE_DIR" "$PREVIOUS_DIR"
                      fi
                      mv "$NEXT_DIR" "$LIVE_DIR"

                      cd "$LIVE_DIR"
                      pm2 start dist/index.js --name "luogu-backend" --node-args="--env-file=.env" --update-env
                      pm2 save
                      rm -rf "$PREVIOUS_DIR"
