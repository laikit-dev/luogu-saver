name: Auto Deploy with OSS
permissions:
    contents: read

on:
    push:
        branches:
            - master
    workflow_dispatch:

concurrency:
    group: production-deployment
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: production
        steps:
            - name: Checkout
              uses: actions/checkout@v6.0.1

            - name: Setup Node
              uses: actions/setup-node@v6.1.0
              with:
                  node-version: 22
                  cache: npm

            - name: Validate deployment configuration
              env:
                  SERVER_A_HOST: ${{ secrets.SERVER_A_HOST }}
                  SERVER_A_PASSWORD: ${{ secrets.SERVER_A_PASSWORD }}
                  SERVER_B_HOST: ${{ secrets.SERVER_B_HOST }}
                  SERVER_B_PASSWORD: ${{ secrets.SERVER_B_PASSWORD }}
                  OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
                  OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
                  OSS_DOMAIN: ${{ secrets.OSS_DOMAIN }}
                  OSS_KEY_ID: ${{ secrets.OSS_KEY_ID }}
                  OSS_KEY_SECRET: ${{ secrets.OSS_KEY_SECRET }}
                  BACKEND_API_URL: ${{ secrets.BACKEND_API_URL }}
              run: |
                  test -n "$SERVER_A_HOST"
                  test -n "$SERVER_A_PASSWORD"
                  test -n "$SERVER_B_HOST"
                  test -n "$SERVER_B_PASSWORD"
                  test -n "$OSS_ENDPOINT"
                  test -n "$OSS_BUCKET"
                  test -n "$OSS_DOMAIN"
                  test -n "$OSS_KEY_ID"
                  test -n "$OSS_KEY_SECRET"
                  test -n "$BACKEND_API_URL"

            - name: Install Dependencies
              run: npm ci

            - name: Build Markdown Renderer
              run: npm run build -w @luogu-saver-next/markdown-renderer

            - name: Build Frontend
              run: npm run build:app -w @luogu-saver-next/frontend
              env:
                  VITE_API_URL: ${{ secrets.BACKEND_API_URL }}
                  VITE_CDN_URL: ${{ secrets.OSS_DOMAIN }}/luogu-saver/

            - name: Build Backend
              run: npm run build -w @luogu-saver-next/backend

            - name: Ensure sshpass is installed
              run: |
                  if ! command -v sshpass >/dev/null 2>&1; then
                    sudo apt-get update -qq
                    sudo apt-get install -y -qq sshpass
                  fi

            - name: Deploy Frontend and Sync Assets to S3
              timeout-minutes: 15
              env:
                  SERVER_A_HOST: ${{ secrets.SERVER_A_HOST }}
                  SSHPASS: ${{ secrets.SERVER_A_PASSWORD }}
                  AWS_ACCESS_KEY_ID: ${{ secrets.OSS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.OSS_KEY_SECRET }}
                  AWS_DEFAULT_REGION: us-east-1
                  AWS_MAX_ATTEMPTS: '8'
                  AWS_RETRY_MODE: adaptive
                  OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
                  OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
              run: |
                  set -euo pipefail

                  CTRL_SOCK="/tmp/ssh-deploy-a.sock"
                  SSH_BASE_OPTS=(
                    -o StrictHostKeyChecking=no
                    -o UserKnownHostsFile=/dev/null
                    -o ConnectTimeout=30
                    -o ServerAliveInterval=15
                    -o ServerAliveCountMax=6
                    -o TCPKeepAlive=yes
                  )

                  cleanup() {
                    ssh -S "$CTRL_SOCK" -O exit "root@$SERVER_A_HOST" >/dev/null 2>&1 || true
                    rm -f "$CTRL_SOCK"
                  }
                  trap cleanup EXIT

                  # Open one persistent multiplexed SSH connection with retry/backoff to avoid
                  # triggering SSH connection rate limits on the remote host.
                  for attempt in 1 2 3 4; do
                    if sshpass -e ssh "${SSH_BASE_OPTS[@]}" \
                      -o ControlMaster=auto \
                      -o ControlPath="$CTRL_SOCK" \
                      -o ControlPersist=300 \
                      "root@$SERVER_A_HOST" true; then
                      break
                    fi
                    if [ "$attempt" -eq 4 ]; then
                      echo "Failed to connect to SERVER_A after 4 attempts" >&2
                      exit 1
                    fi
                    delay=$((attempt * 10))
                    echo "SSH connect to SERVER_A failed (attempt $attempt), retrying in ${delay}s..." >&2
                    sleep "$delay"
                  done

                  echo "Streaming frontend bundle over multiplexed SSH..."
                  tar -czf - -C packages/frontend/dist . | ssh "${SSH_BASE_OPTS[@]}" \
                    -S "$CTRL_SOCK" "root@$SERVER_A_HOST" \
                    'set -eu; rm -rf /opt/luogu-saver-frontend-next && mkdir -p /opt/luogu-saver-frontend-next && tar -xzf - -C /opt/luogu-saver-frontend-next'

                  echo "Syncing assets to OSS and cutting over frontend..."
                  {
                    printf 'export AWS_ACCESS_KEY_ID=%q\n' "$AWS_ACCESS_KEY_ID"
                    printf 'export AWS_SECRET_ACCESS_KEY=%q\n' "$AWS_SECRET_ACCESS_KEY"
                    printf 'export AWS_DEFAULT_REGION=%q\n' "$AWS_DEFAULT_REGION"
                    printf 'export AWS_MAX_ATTEMPTS=%q\n' "$AWS_MAX_ATTEMPTS"
                    printf 'export AWS_RETRY_MODE=%q\n' "$AWS_RETRY_MODE"
                    printf 'export OSS_ENDPOINT=%q\n' "$OSS_ENDPOINT"
                    printf 'export OSS_BUCKET=%q\n' "$OSS_BUCKET"
                    cat <<'REMOTE_SCRIPT'
                  set -eu
                  export PATH="/usr/local/bin:$PATH"

                  if ! command -v aws >/dev/null 2>&1 || ! aws --version 2>&1 | grep -q '^aws-cli/2\.'; then
                    if ! command -v curl >/dev/null 2>&1 || ! command -v unzip >/dev/null 2>&1; then
                      if command -v apt-get >/dev/null 2>&1; then
                        apt-get update -qq && apt-get install -y -qq curl unzip
                      elif command -v dnf >/dev/null 2>&1; then
                        dnf install -y -q curl unzip
                      elif command -v yum >/dev/null 2>&1; then
                        yum install -y -q curl unzip
                      elif command -v apk >/dev/null 2>&1; then
                        apk add --no-cache curl unzip
                      else
                        echo "curl and unzip are required to install AWS CLI v2" >&2
                        exit 1
                      fi
                    fi

                    ARCH=$(uname -m)
                    TMP_DIR=$(mktemp -d)
                    trap 'rm -rf "$TMP_DIR"' EXIT
                    curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-${ARCH}.zip" -o "$TMP_DIR/awscliv2.zip"
                    unzip -q "$TMP_DIR/awscliv2.zip" -d "$TMP_DIR"
                    "$TMP_DIR/aws/install" --update
                    rm -rf "$TMP_DIR"
                    trap - EXIT
                  fi

                  aws configure set default.s3.max_concurrent_requests 2
                  aws configure set default.s3.multipart_threshold 64MB

                  retry_s3() {
                    attempt=1
                    while [ "$attempt" -le 3 ]; do
                      if "$@"; then
                        return 0
                      fi
                      if [ "$attempt" -eq 3 ]; then
                        return 1
                      fi
                      delay=$((attempt * 10))
                      echo "S3 sync failed (attempt $attempt), retrying in ${delay}s..." >&2
                      sleep "$delay"
                      attempt=$((attempt + 1))
                    done
                  }

                  NEXT_DIR=/opt/luogu-saver-frontend-next
                  LIVE_DIR=/opt/luogu-saver-frontend

                  retry_s3 aws s3 sync "$NEXT_DIR/assets" "s3://$OSS_BUCKET/luogu-saver/assets/" \
                    --endpoint-url "$OSS_ENDPOINT" \
                    --acl public-read \
                    --cache-control "public, max-age=31536000, immutable" \
                    --size-only

                  retry_s3 aws s3 sync "$NEXT_DIR" "s3://$OSS_BUCKET/luogu-saver/" \
                    --endpoint-url "$OSS_ENDPOINT" \
                    --acl public-read \
                    --exclude "assets/*" \
                    --exclude "index.html" \
                    --size-only

                  mkdir -p "$LIVE_DIR"
                  for entry in "$NEXT_DIR"/*; do
                    name=$(basename "$entry")
                    [ "$name" = "index.html" ] && continue
                    cp -a "$entry" "$LIVE_DIR/"
                  done
                  cp -a "$NEXT_DIR/index.html" "$LIVE_DIR/.index.html.tmp"
                  mv -f "$LIVE_DIR/.index.html.tmp" "$LIVE_DIR/index.html"
                  rm -rf "$NEXT_DIR"
                  REMOTE_SCRIPT
                  } | ssh "${SSH_BASE_OPTS[@]}" -S "$CTRL_SOCK" "root@$SERVER_A_HOST" 'bash -s'

            - name: Deploy Backend
              timeout-minutes: 10
              env:
                  SERVER_B_HOST: ${{ secrets.SERVER_B_HOST }}
                  SSHPASS: ${{ secrets.SERVER_B_PASSWORD }}
              run: |
                  set -euo pipefail

                  CTRL_SOCK="/tmp/ssh-deploy-b.sock"
                  SSH_BASE_OPTS=(
                    -o StrictHostKeyChecking=no
                    -o UserKnownHostsFile=/dev/null
                    -o ConnectTimeout=30
                    -o ServerAliveInterval=15
                    -o ServerAliveCountMax=6
                    -o TCPKeepAlive=yes
                  )

                  cleanup() {
                    ssh -S "$CTRL_SOCK" -O exit "root@$SERVER_B_HOST" >/dev/null 2>&1 || true
                    rm -f "$CTRL_SOCK"
                  }
                  trap cleanup EXIT

                  for attempt in 1 2 3 4; do
                    if sshpass -e ssh "${SSH_BASE_OPTS[@]}" \
                      -o ControlMaster=auto \
                      -o ControlPath="$CTRL_SOCK" \
                      -o ControlPersist=300 \
                      "root@$SERVER_B_HOST" true; then
                      break
                    fi
                    if [ "$attempt" -eq 4 ]; then
                      echo "Failed to connect to SERVER_B after 4 attempts" >&2
                      exit 1
                    fi
                    delay=$((attempt * 10))
                    echo "SSH connect to SERVER_B failed (attempt $attempt), retrying in ${delay}s..." >&2
                    sleep "$delay"
                  done

                  echo "Streaming backend bundle over multiplexed SSH..."
                  BACKEND_ITEMS=(dist package.json)
                  if [ -d packages/backend/scripts ]; then
                    BACKEND_ITEMS+=(scripts)
                  fi
                  tar -czf - -C packages/backend "${BACKEND_ITEMS[@]}" | ssh "${SSH_BASE_OPTS[@]}" \
                    -S "$CTRL_SOCK" "root@$SERVER_B_HOST" \
                    'set -eu; rm -rf /opt/luogu-saver-backend-next && mkdir -p /opt/luogu-saver-backend-next && tar -xzf - -C /opt/luogu-saver-backend-next'

                  echo "Preparing and cutting over backend..."
                  ssh "${SSH_BASE_OPTS[@]}" -S "$CTRL_SOCK" "root@$SERVER_B_HOST" 'bash -s' <<'REMOTE_SCRIPT'
                  set -eu
                  export NVM_DIR="$HOME/.nvm"
                  [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

                  LIVE_DIR=/opt/luogu-saver-backend
                  NEXT_DIR=/opt/luogu-saver-backend-next
                  PREVIOUS_DIR=/opt/luogu-saver-backend-previous

                  if [ -f "$LIVE_DIR/.env" ]; then
                    cp -a "$LIVE_DIR/.env" "$NEXT_DIR/.env"
                  fi
                  if [ -f "$LIVE_DIR/config.yml" ]; then
                    cp -a "$LIVE_DIR/config.yml" "$NEXT_DIR/config.yml"
                  fi

                  cd "$NEXT_DIR"
                  if [ -f "$LIVE_DIR/package.json" ] && [ -d "$LIVE_DIR/node_modules" ] && cmp -s "$LIVE_DIR/package.json" "$NEXT_DIR/package.json"; then
                    echo "package.json unchanged; reusing existing node_modules"
                    cp -a "$LIVE_DIR/node_modules" "$NEXT_DIR/node_modules"
                    if [ -f "$LIVE_DIR/package-lock.json" ]; then
                      cp -a "$LIVE_DIR/package-lock.json" "$NEXT_DIR/package-lock.json"
                    fi
                  else
                    npm install --omit=dev --no-audit --no-fund
                  fi

                  if [ -f .env ]; then
                    node --env-file=.env -e "require('./dist/config')"
                  else
                    node -e "require('./dist/config')"
                  fi

                  if pm2 describe luogu-backend > /dev/null; then
                    pm2 stop luogu-backend
                    pm2 delete luogu-backend
                  fi

                  rm -rf "$PREVIOUS_DIR"
                  if [ -d "$LIVE_DIR" ]; then
                    mv "$LIVE_DIR" "$PREVIOUS_DIR"
                  fi
                  mv "$NEXT_DIR" "$LIVE_DIR"

                  cd "$LIVE_DIR"
                  pm2 start dist/index.js --name "luogu-backend" --node-args="--env-file=.env" --update-env
                  pm2 save
                  rm -rf "$PREVIOUS_DIR"
                  REMOTE_SCRIPT
